name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: python -m pip install numpy==2.4.3 -r requirements/web.txt
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-deps -e .
      - run: gh release download --repo "$GITHUB_REPOSITORY" --pattern ema.pt --dir "$RUNNER_TEMP/release"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git clone --quiet https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout --quiet a2b92777574c2feda07994cd4f1079a3dfc151f8
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - run: python tools/build_web.py ort model shrimp six --checkpoint "$RUNNER_TEMP/release/ema.pt" --emxx "$RUNNER_TEMP/emsdk/upstream/emscripten/em++"
      # Seal and the Strix network have no licence of their own. The site serves them only while the repository
      # variables say so; a local build (`python tools/build_web.py seal strix-network`) always makes them.
      - if: ${{ vars.PUBLISH_SEAL == 'true' }}
        run: python tools/build_web.py seal --emxx "$RUNNER_TEMP/emsdk/upstream/emscripten/em++"
      - if: ${{ vars.PUBLISH_STRIX_NETWORK == 'true' }}
        run: python tools/build_web.py strix-network
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
