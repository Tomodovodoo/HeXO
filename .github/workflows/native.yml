name: Native rules
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/*.cpp'
      - 'tests/benchmark.py'
      - 'tests/reference.py'
      - 'tests/test_engine.py'
      - 'tests/test_leaf_tactics.py'
      - 'tools/tactical/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The C++ and Rust tests and the profile-guided build. The Python tests run in the Contracts workflow.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: c++ -std=c++20 -O2 tests/tt_injection.cpp -o tt_injection && ./tt_injection
      - run: c++ -std=c++20 -O2 tests/gumbel.cpp -o gumbel_test && ./gumbel_test
      - run: cargo test --release --manifest-path tools/tactical/Cargo.toml
        env:
          CARGO_BUILD_JOBS: 2
      - run: python -m pip install numpy
      - run: python -m pip install --no-deps -e .
      - name: Check GCC profile build
        run: |
          cmake -S . -B build/pgo -DCMAKE_BUILD_TYPE=Release -DHEXO_NATIVE_CPU=ON -DHEXO_NATIVE_PGO=GENERATE
          cmake --build build/pgo --target hexo --parallel 2
          HEXO_NATIVE_DIR=build/pgo python -m unittest tests.test_engine.NativeRules tests.test_leaf_tactics -v
          cmake -S . -B build/pgo -DHEXO_NATIVE_PGO=USE
          cmake --build build/pgo --target hexo --parallel 2
          HEXO_NATIVE_DIR=build/pgo python -m unittest tests.test_engine.NativeRules tests.test_leaf_tactics -v
