name: Native rules
on:
  pull_request:
    paths:
      - 'src/**'
      - '*.py'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: python -m unittest tests.test_engine.NativeRules tests.test_curriculum tests.test_proof tests.test_leaf_tactics tests.test_notation_api -v
