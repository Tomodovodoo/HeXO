name: Native rules
on:
  pull_request:
    paths:
      - 'src/**'
      - '*.py'
      - 'tests/**'
      - 'tools/seal_current*'
      - 'CMakeLists.txt'
      - '.github/workflows/native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: python -m pip install numpy
      - run: python -m unittest tests.test_neural_search tests.test_engine.NativeRules tests.test_curriculum tests.test_proof tests.test_leaf_tactics tests.test_notation_api tests.test_seal_current tests.test_forcing_material tests.test_isolated_tactics -v
      - run: c++ -std=c++20 -O2 tests/tt_injection.cpp -o build/tt_injection
      - run: ./build/tt_injection
      - run: c++ -std=c++20 -O2 tests/gumbel.cpp -o build/gumbel_test
      - run: ./build/gumbel_test
