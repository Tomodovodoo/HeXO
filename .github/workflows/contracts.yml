name: Contracts
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'tests/web/**'
      - 'tests/test_web_*.py'
      - '.github/workflows/native.yml'
      - '.github/workflows/web.yml'
      - '.github/workflows/engines.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The Python fast tier outside the browser tests (those run in the Browser engine workflow). A manual dispatch
  # runs the slow tier too.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 4
      - run: python -m pip install numpy
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-deps -e .
      - run: CARGO_BUILD_JOBS=4 python tools/build_tactical.py
      - run: python -m tests -j 4 '!test_web_*'
        env:
          OMP_NUM_THREADS: 2
          HEXO_SLOW: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
