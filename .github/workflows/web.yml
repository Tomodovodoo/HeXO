name: Browser engine
on:
  pull_request:
    paths:
      - 'web/engine/**'
      - 'web/coi-sw.js'
      - 'src/**'
      - 'python/export_web.py'
      - 'python/hexcrop.py'
      - 'python/hexnet.py'
      - 'python/neural_search.py'
      - 'python/tactical_proof.py'
      - 'tools/tactical/**'
      - 'tools/shrimp_web/**'
      - 'tools/build_web.py'
      - 'tests/test_web_*.py'
      - 'tests/web/**'
      - 'requirements/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: python tools/build_tactical.py
      - run: python -m pip install numpy==2.4.3 -r requirements/web.txt
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest tests.test_web_engine tests.test_web_tactical tests.test_web_shrimp -v
