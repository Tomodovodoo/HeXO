name: Browser engine
on:
  pull_request:
    paths:
      - 'web/engine/**'
      - 'web/coi-sw.js'
      - 'src/**'
      - 'python/export_web.py'
      - 'python/hexcrop.py'
      - 'python/hexnet.py'
      - 'python/neural_search.py'
      - 'python/play.py'
      - 'python/tactical_proof.py'
      - 'tools/tactical/**'
      - 'tools/shrimp_web/**'
      - 'tools/strix_web/**'
      - 'tools/build_web.py'
      - 'tools/seal_adapter.cpp'
      - 'tools/engines.json'
      - 'tests/__init__.py'
      - 'tests/__main__.py'
      - 'tests/fixtures/**'
      - 'tests/test_web_*.py'
      - 'tests/web/**'
      - 'requirements/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 12 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          git clone --quiet https://github.com/Ramora0/HexTicTacToe.git "$RUNNER_TEMP/seal"
          git -C "$RUNNER_TEMP/seal" checkout --quiet 3474edb5a9cdb12004c70aac69a631a45a3cb9e0
      - run: |
          git clone --quiet https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout --quiet a2b92777574c2feda07994cd4f1079a3dfc151f8
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHEXO_SEAL_SOURCE="$RUNNER_TEMP/seal"
      - run: cmake --build build --parallel 2
      - run: python tools/build_tactical.py
      - run: python tools/build_web.py seal --emxx "$RUNNER_TEMP/emsdk/upstream/emscripten/em++"
      - run: python -m pip install numpy==2.4.3 -r requirements/web.txt
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-deps -e .
      # Pull requests run the fast tier; a manual dispatch runs the slow tier too.
      - run: python -m tests -j 4 'test_web_*'
        env:
          OMP_NUM_THREADS: 2
          HEXO_SLOW: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
