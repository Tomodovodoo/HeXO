name: Engines
on:
  pull_request:
    paths:
      - 'python/engine_setup.py'
      - 'tools/build_engines.py'
      - 'tools/build_strix_learned.py'
      - 'tools/engines.json'
      - 'tools/strix_learned/**'
      - '.github/workflows/engines.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Release to create, e.g. engines-v1
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
      - run: rustup update stable
      - run: python tools/build_engines.py build --out dist --all-pythons
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Engines ${TAG#engines-v}" \
            --notes "Prebuilt Strix and Shrimp for the play page's one-click engine setup. Pin with: python tools/build_engines.py pin $TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
