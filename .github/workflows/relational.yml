name: Relational model
on:
  pull_request:
    paths:
      - 'relational_*.py'
      - 'src/relational_graph.cpp'
      - 'tests/test_relational.py'
      - 'tests/test_relational_player.py'
      - '.github/workflows/relational.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-and-gradients:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.4.3
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: python -m unittest tests.test_relational tests.test_relational_player -v
