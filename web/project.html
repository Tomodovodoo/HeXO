main{max-width:1400px;margin:auto;padding:24px 32px}h2{font-size:16px;margin:0;color:var(--ink)}section.runs{background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:16px 18px;margin-bottom:20px}

.panel-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.panel-head h2 button{all:unset;cursor:zoom-in;font-size:15px;font-weight:600;color:var(--ink)}.panel-head h2 button:focus-visible{outline:2px solid var(--accent)}.panel-head .tools{margin-left:auto;display:flex;gap:4px}
.showing{font-size:11px;color:var(--muted);text-align:center;margin:4px 0 2px}.note{font-size:11px;color:var(--muted);margin:2px 0 0}.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px;font-size:11px;margin:4px 0 6px;max-height:48px;overflow:hidden}.legend span{display:inline-flex;gap:5px;align-items:center}

<header><h1>Bubble</h1><span>Dense run comparison</span><label class="smooth" title="Exponential smoothing over the x-axis of the full logged series: the value is the weight kept per thousandth of the visible span, so every series smooths over the same span however densely it was logged">Smoothing <input id="smooth" type="range" min="0" max="0.99" step="0.01"> <output id="smooth-value"></output></label><label class="smooth">from step <input id="from-step" type="number" min="0" step="500"></label><div id="status" role="status">Connecting...</div></header>

<div class="table-scroll"><table><thead><tr><th></th><th></th><th>Run</th><th>Variant</th><th>Step</th><th>Elo (95%)</th><th>Champion</th><th>Learner</th><th>Actors</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<div class="grid" id="grid"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const COLORS=['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];
const SOURCES={converted:[7,4],fresh:[2,3],newest:[10,3,2,3]};
const PANELS=[
{id:'policy',title:'Policy CE',metric:'policy_ce',smooth:true,xs:['step','hours'],log:true},
{id:'value',title:'Value BCE',metric:'value_bce',smooth:true,xs:['step','hours'],log:true},
{id:'outcome',title:'Outcome BCE',metric:'outcome_bce',smooth:true,xs:['step','hours'],log:true,note:'Value logit against the hard outcome of finished games, rows with a proof left out; equals the value BCE on those rows at outcome_lambda 1'},
{id:'voutcome',title:'Validation outcome BCE',metric:'validation_outcome_bce',xs:['step','hours'],log:true,note:'EMA weights, one point per export: held-out rows of finished games in the window against their hard outcome, rows with a proof left out. The metrics also split it into outcome_bce_exact and outcome_bce_unproven'},
{id:'vpolicy',title:'Validation policy CE',metric:'validation_policy_ce',sources:'policy_ce',from:['newest'],xs:['step','hours'],log:true,note:'EMA weights, one point per export. Solid: held-out rows of the window; dashed: held-out rows of the newest actor shards'},
{id:'vpolicykl',title:'Validation policy KL',metric:'validation_policy_kl',sources:'policy_kl',from:['newest'],xs:['step','hours'],zero:true,note:'EMA weights, one point per export. KL(target || net) = policy CE minus target entropy on rows with a searched policy. Solid: held-out window; dashed: held-out rows of the newest actor shards'},
{id:'vpolicyentropy',title:'Policy target entropy',metric:'validation_policy_target_entropy',sources:'policy_target_entropy',xs:['step','hours'],zero:true,note:'EMA weights, one point per export. Entropy of the searched visit distribution on rows with a policy target. Solid: held-out window; dashed: fixed held-out rows per source'},
{id:'vpolicytop1',title:'Validation policy top-1',metric:'validation_policy_top1',sources:'policy_top1',xs:['step','hours'],zero:true,max:1,note:'EMA weights, one point per export. Share of policy-target rows where the network and searched visit distribution choose the same argmax. Solid: held-out window; dashed: fixed held-out rows per source'},
{id:'vpolicytop2',title:'Validation policy top-2',metric:'validation_policy_top2',sources:'policy_top2',from:['newest'],xs:['step','hours'],zero:true,max:1,note:'EMA weights, one point per export. Share of policy-target rows where the network\'s argmax is among the two highest-mass moves of the searched target, so a first stone trained on a pair target counts either stone of the pair. Solid: held-out window; dashed: held-out rows of the newest actor shards'},
{id:'vvalue',title:'Validation value BCE',metric:'validation_value_bce',sources:'value_bce',xs:['step','hours'],log:true,note:'EMA weights, one point per export. Solid: held-out rows of the window; dashed: fixed held-out rows per source'},
{id:'vgap',title:'Policy CE gap',sources:'gap_policy_ce',xs:['step','hours'],note:'Per source: fixed held-out rows minus fixed training rows, EMA weights'},
{id:'vgapvalue',title:'Value BCE gap',sources:'gap_value_bce',xs:['step','hours'],note:'Per source: fixed held-out rows minus fixed training rows, EMA weights'},
{id:'vcurve',title:'Value loss by plies remaining',history:'value_curve',xs:['remaining'],zero:true,ref:Math.LN2,note:'EMA weights, held-out finished games. Colour runs from older purple curves to the thick gold latest curve; lower loss is better. Hover to compare checkpoints at the same distance. Faint line: 0.693 for a 50/50 prediction.'},
{id:'pcurve',title:'Policy CE by ply',sources:'policy_ce_curve',prefix:'',from:['fresh','newest'],xs:['ply'],zero:true,note:'Latest checkpoint, EMA weights: policy CE of held-out full-search rows, Gaussian smoothing over 4 plies'},
{id:'vply',title:'Value BCE by ply',sources:'value_bce_by_ply',prefix:'',from:['fresh','newest'],xs:['ply'],zero:true,ref:Math.LN2,note:'Latest checkpoint, EMA weights: value BCE of held-out rows of finished games against their outcome, Gaussian smoothing over 4 plies. Faint line: 0.693 (no information)'},
{id:'vsurf',title:'Value BCE surface',surface:'value_surface',label:'BCE',centre:Math.LN2,xs:['ply'],note:'Latest checkpoint, EMA weights: mean value BCE of held-out rows of finished games per 16-ply cell, blank under 8 rows. Centre: 0.693 (no information)'},
{id:'xsurf',title:'Value excess surface',surface:'value_excess_surface',label:'excess',centre:0,xs:['ply'],note:'As the value BCE surface, minus the binary entropy of the cell outcome rate. Centre: 0 (base rate)'},
{id:'psurf',title:'Policy CE surface',surface:'policy_surface',label:'CE',xs:['ply'],note:'Latest checkpoint, EMA weights: mean policy CE of held-out full-search rows per 16-ply cell, blank under 8 rows. Centre: mean over cells'},
{id:'horizon',title:'Value horizon',sources:'value_horizon',from:['fresh','newest'],xs:['step','hours'],zero:true,note:'Plies remaining at which the smoothed held-out value BCE first exceeds ln 2 / 2 = 0.347 (halfway between perfect and chance)'},
{id:'regret',title:'Value regret',sources:'value_regret',from:['fresh','newest'],xs:['step','hours'],note:'Held-out value BCE minus that of a calibration of the searched root value and plies remaining, fitted on training rows'},
{id:'elo',title:'Elo',metric:'elo',xs:['step','hours'],band:true,external:true,pair:{dash:[5,4],perRun:true},note:'Each run has its own league scale (first rated checkpoint = 0); shading is the 95% interval. Dashed: current anchor ratings and provisional external estimates. External intervals exclude uncertainty from differences in playing budgets'},
{id:'sps',title:'Samples / s',metric:'samples_per_second',smooth:true,xs:['step','hours'],zero:true},
{id:'pps',title:'Placements / s',metric:'placements_per_second',smooth:true,xs:['hours'],perRun:true,zero:true,note:'All actor workers of a run'},
{id:'gph',title:'Games per hour',metric:'games_per_hour',smooth:true,xs:['hours'],perRun:true,zero:true,note:'From games completed between metrics lines, summed over workers'},
{id:'gpu',title:'GPU utilization (%)',metric:'utilization',smooth:true,xs:['hours'],perRun:true,zero:true,max:100,note:'Whole device, sampled by the dashboard while the run is live'},
{id:'mem',title:'GPU memory (GiB)',metric:'used_mib',smooth:true,xs:['hours'],perRun:true,zero:true,scale:1/1024,note:'Whole device, sampled by the dashboard while the run is live'}];
let project=null,rows=[],cache=new Map(),state={selected:null,x:{},log:{},src:{},srun:{},full:null,smooth:.6,fromStep:2500};
try{Object.assign(state,JSON.parse(localStorage.getItem('hexo-project')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('hexo-project',JSON.stringify(state))}catch(e){}};
const selected=()=>state.selected?rows.filter(r=>state.selected.includes(r.key)):rows.slice(0,10);
const style=(i,dash)=>({color:COLORS[i%COLORS.length],dash:dash||(i>=COLORS.length?[6,4]:[])});
const fmt=v=>{if(!Number.isFinite(v))return'-';const a=Math.abs(v);return a>=1e4?Math.round(v).toLocaleString():a>=100?v.toFixed(0):a>=10?v.toFixed(1):a>=.01||a===0?v.toPrecision(4):v.toExponential(2)};
/** Per-pixel-column [x, top, bottom] of a raw series denser than the chart, or null when a polyline is readable. */
const rawBand=(raw,sx,sy)=>{const pts=raw.filter(q=>q[1]!=null);if(!pts.length)return null;const x0=sx(pts[0][0]),x1=sx(pts[pts.length-1][0]),width=Math.abs(x1-x0);if(pts.length<2*width)return null;const cols=new Map();for(const q of pts){const x=Math.round(sx(q[0])),y=sy(q[1]),c=cols.get(x);if(!c)cols.set(x,[x,y,y]);else{if(y<c[1])c[1]=y;if(y>c[2])c[2]=y}}return [...cols.values()].sort((a,b)=>a[0]-b[0])};
const ema=(pts,w,unit)=>{let m=0,n=0,prev=null;return pts.map(q=>{const k=unit>0&&prev!=null?(q[0]-prev)/unit:1,a=w**k;m=m*a+(1-a)*q[1];n+=k;prev=q[0];return [q[0],m/(1-w**n),...q.slice(2)]})};
const XLABEL={step:'Step',hours:'Time (hours)',remaining:'Plies remaining',ply:'Ply'},xfmt=(x,v)=>x==='hours'?v.toFixed(2)+' h':x==='remaining'?`${Math.round(v)} plies`:x==='ply'?`ply ${Math.round(v)}`:`${Math.round(v)}`;
const tick=v=>Math.abs(v)>=1e-3||v===0?v.toLocaleString(undefined,{maximumFractionDigits:6}):v.toExponential(1);
const age=s=>s==null?'-':s<90?`${Math.round(s)} s`:s<5400?`${Math.round(s/60)} min`:s<172800?`${(s/3600).toFixed(1)} h`:`${Math.round(s/86400)} d`;
function swatch(i,dash,color){const s=style(i,dash);if(color)s.color=color;const e=document.createElementNS('http://www.w3.org/2000/svg','svg');e.setAttribute('class','swatch');e.setAttribute('width',22);e.setAttribute('height',4);
e.innerHTML=`<line x1="0" y1="2" x2="22" y2="2" stroke="${s.color}" stroke-width="3" stroke-dasharray="${s.dash.join(' ')||'none'}"/>`;return e}
function cell(tr,content,cls){const td=document.createElement('td');if(content instanceof Node)td.append(content);else td.textContent=content;if(cls)td.className=cls;tr.append(td);return td}
function renderTable(){const body=$('rows'),chosen=new Set(selected().map(r=>r.key));body.replaceChildren();
for(const r of rows){const tr=document.createElement('tr'),box=document.createElement('input');box.type='checkbox';box.checked=chosen.has(r.key);box.setAttribute('aria-label',`Show ${r.key}`);
box.onchange=()=>{const keys=new Set(selected().map(x=>x.key));box.checked?keys.add(r.key):keys.delete(r.key);state.selected=rows.map(x=>x.key).filter(k=>keys.has(k));save();refresh()};
cell(tr,box);cell(tr,swatch(r.index));cell(tr,r.run.name,'name');cell(tr,r.variant);cell(tr,(r.run.steps[r.variant]??0).toLocaleString());
const e=r.run.elo[r.variant];cell(tr,e?`${fmt(e.elo)}${e.interval?` [${fmt(e.interval[0])}, ${fmt(e.interval[1])}]`:''} @ ${e.step}`:'Unrated');cell(tr,r.run.champion||'-');
const lh=r.run.learner_heartbeat[r.variant];cell(tr,lh==null?'-':`${r.run.learner_stage[r.variant]||'?'} ${age(lh)} ago`,lh!=null&&lh<30?'live':'stale');
cell(tr,r.run.actor_processes?`${r.run.actor_processes} proc, ${age(r.run.actor_heartbeat)} ago`:'-',r.run.actor_heartbeat!=null&&r.run.actor_heartbeat<30?'live':'stale');
const a=document.createElement('a');a.href='/?'+new URLSearchParams({run:r.run.name,variant:r.variant});a.textContent='Open';cell(tr,a);body.append(tr)}
const n=selected().length;$('showing').textContent=state.selected?`Showing ${n} of ${rows.length} runs`:`Showing first ${Math.min(10,rows.length)} runs`}
function panelSeries(p){if(p.history)return [];const out=[],seen=new Set(),paired=new Set(),external=new Set();for(const r of selected()){if(p.perRun){if(seen.has(r.run.name))continue;seen.add(r.run.name)}
if(p.metric)out.push({key:p.perRun?r.run.name:r.key,label:p.perRun?r.run.name:r.key,run:r.run,variant:p.perRun?'main':r.variant,index:r.index,metric:p.metric});
if(p.pair&&(!p.pair.perRun||!paired.has(r.run.name))){paired.add(r.run.name);const key=p.pair.perRun?r.run.name:r.key;for(const name of Object.keys(r.run.anchors||{seal:{}})){const metric=name==='seal'?'seal_elo':`anchor_elo:${name}`;out.push({key:`${key}|${metric}`,label:`${key} ${name}`,run:r.run,variant:r.variant,index:r.index,metric,dash:p.pair.dash})}}
if(p.external&&!external.has(r.run.name)){external.add(r.run.name);for(const[id,v]of Object.entries(r.run.external_ratings||{})){const metric=`external_elo:${id}`;out.push({key:`${r.run.name}|${metric}`,label:`${r.run.name} ${v.label} (provisional)`,run:r.run,variant:'main',index:r.index+3,metric,dash:[9,4],note:v.note})}}
if(p.sources)for(const[src,dash]of Object.entries(SOURCES))if(!p.from||p.from.includes(src))out.push({key:`${r.key}|${src}`,label:`${r.key} · ${p.sources.startsWith('gap')?'gap':'held-out'} ${src}`,run:r.run,variant:r.variant,index:r.index,metric:`${p.prefix??'validation_'}${src}_${p.sources}`,dash})}return out}
const SURFACE_SOURCES=['fresh','newest'];
const surfOf=p=>{const rs=selected(),r=rs.find(x=>x.key===state.srun[p.id])||rs[0],src=SURFACE_SOURCES.includes(state.src[p.id])?state.src[p.id]:SURFACE_SOURCES[0];return {r,src,k:r&&`${r.run.name}|${r.variant}|${src}_${p.surface||p.history}|${p.surface?'surface':'history'}`}};
const xOf=p=>p.xs.includes(state.x[p.id])?state.x[p.id]:p.xs[0];
const fromOf=p=>xOf(p)==='step'?state.fromStep:0;
const cacheKey=(s,p)=>`${s.run.name}|${s.variant}|${s.metric}|${xOf(p)}`;
async function fetchSeries(){const jobs=[];for(const p of PANELS)for(const s of panelSeries(p)){const k=cacheKey(s,p),hit=cache.get(k),from=fromOf(p),x=xOf(p),now=project.now;if(hit&&hit.from===from&&(hit.poll===now||(!s.run.live&&now-hit.poll<60)))continue;
jobs.push(async()=>{const q=new URLSearchParams({run:s.run.name,variant:s.variant,metric:s.metric,x,max_points:p.smooth?20000:1000,from_step:from});const res=await fetch('/api/series?'+q);if(!res.ok)throw Error(`${s.metric} of ${s.label}: HTTP ${res.status}`);const points=(await res.json()).points,cur=cache.get(k);if(from===fromOf(p)&&!(cur?.from===from&&cur.poll>now))cache.set(k,{poll:now,from,points})})}
for(const p of PANELS){if(!p.surface&&!p.history)continue;const s=surfOf(p),hit=s.r&&cache.get(s.k);if(!s.r||hit&&(hit.poll===project.now||(!s.r.run.live&&project.now-hit.poll<60)))continue;
jobs.push(async()=>{const q=new URLSearchParams({run:s.r.run.name,variant:s.r.variant,metric:`${s.src}_${p.surface||p.history}`});if(p.history){q.set('history','1');q.set('x',xOf(p))}const res=await fetch((p.history?'/api/series?':'/api/surface?')+q);if(!res.ok)throw Error(`${p.title} of ${s.r.key}: HTTP ${res.status}`);cache.set(s.k,{poll:project.now,grid:await res.json()})})}
let failure=null;const worker=async()=>{while(jobs.length){try{await jobs.shift()()}catch(e){failure=e}}};await Promise.all(Array.from({length:6},worker));if(failure)throw failure}
function trace(pts,sx,sy,ctx){let gap=true;pts.forEach((q,i)=>{if(q[1]==null){gap=true;return}const x=sx(q[0]),y=sy(q[1]),alone=gap&&(i+1>=pts.length||pts[i+1][1]==null);if(alone){ctx.moveTo(x+1.5,y);ctx.arc(x,y,1.5,0,7)}else ctx[gap?'moveTo':'lineTo'](x,y);gap=false})}
function ticks(lo,hi,n){const step0=(hi-lo)/n||1,mag=10**Math.floor(Math.log10(step0)),e=step0/mag,step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag,out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+step*1e-9;v+=step)out.push(+v.toPrecision(12));return out}
function logTicks(lo,hi){const out=[];for(let d=Math.floor(Math.log10(lo));d<=Math.ceil(Math.log10(hi));d++)for(const m of[1,2,5]){const v=m*10**d;if(v>=lo&&v<=hi)out.push(v)}return out.length>=3?out:ticks(lo,hi,4).filter(v=>v>0)}
function buildPanels(){const grid=$('grid');for(const p of PANELS){const el=document.createElement('section');el.className='panel'+(p.history?' history':'');el.id='panel-'+p.id;
el.innerHTML=`<div class="panel-head"><h2><button title="Expand or restore this panel"></button></h2><div class="tools"></div></div><div class="showing"></div><div class="legend"></div><canvas role="img"></canvas>${p.note?`<p class="note"></p>`:''}<div class="tip" hidden></div>`;
el.querySelector('h2 button').textContent=p.title;el.querySelector('canvas').setAttribute('aria-label',p.title+' by run');if(p.note)el.querySelector('.note').textContent=p.note;
el.querySelector('h2 button').onclick=()=>{state.full=state.full===p.id?null:p.id;save();layout()};const tools=el.querySelector('.tools');
if(p.xs.length>1)for(const x of p.xs){const b=document.createElement('button');b.textContent=x==='step'?'Step':'Hours';b.dataset.x=x;b.onclick=()=>{state.x[p.id]=x;save();refresh()};tools.append(b)}
if(p.surface||p.history){const sel=document.createElement('select');sel.setAttribute('aria-label','Run');sel.onchange=()=>{state.srun[p.id]=sel.value;save();refresh()};tools.append(sel);
for(const src of SURFACE_SOURCES){const b=document.createElement('button');b.textContent=src;b.dataset.src=src;b.onclick=()=>{state.src[p.id]=src;save();refresh()};tools.append(b)}}
if(p.log){const b=document.createElement('button');b.textContent='Log';b.className='log';b.onclick=()=>{state.log[p.id]=!state.log[p.id];save();draw(p)};tools.append(b)}
const c=el.querySelector('canvas');c.onpointermove=e=>{const r=c.getBoundingClientRect();draw(p,[e.clientX-r.left,e.clientY-r.top])};c.onpointerleave=()=>draw(p);p.el=el;grid.append(el)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.full){state.full=null;save();layout()}})}
function layout(){for(const p of PANELS)p.el.classList.toggle('full',state.full===p.id);document.body.style.overflow=state.full?'hidden':'';PANELS.forEach(p=>draw(p))}
