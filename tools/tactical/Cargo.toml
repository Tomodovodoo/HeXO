[package]
name = "hexo-tactical"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hexo-solver = { path = "vendor/hexo-strix/hexo-rs/hexo-solver" }
hexo-engine = { path = "vendor/hexo-strix/hexo-rs/hexo-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
