[package]
name = "shrimp-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hexo_engine = { workspace = true }
hexo_utils = { path = "vendor/hexo-bot/packages/hexo_utils" }
half = "2"
# The vendored search modules name their error type through pyo3; this crate stands in for it.
pyo3 = { package = "pyresult", path = "pyresult" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The vendored hexo-bot crates inherit these from their own workspace.
[workspace]
members = [".", "pyresult", "vendor/hexo-bot/packages/hexo_engine", "vendor/hexo-bot/packages/hexo_utils"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
ahash = { version = "0.8", features = ["serde"] }
hexo_engine = { path = "vendor/hexo-bot/packages/hexo_engine" }
pyo3 = { version = "0.28", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("python"))'] }
