[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bubble-hexo"
version = "0.1.0"
description = "Bubble, a self-play learning bot for HeXO"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["packaging"]
dynamic = ["optional-dependencies"]

[tool.setuptools]
package-dir = {"" = "python", "tools" = "tools", "tests" = "tests"}
packages = ["legacy", "tools", "tests"]
py-modules = [
  "bot_api",
  "bubble",
  "dashboard",
  "dense_bootstrap",
  "dense_check",
  "dense_config",
  "dense_data",
  "dense_eval",
  "dense_learn",
  "dense_openings",
  "dense_posterior",
  "dense_player",
  "dense_selfplay",
  "dense_solve",
  "dense_solver",
  "engine_setup",
  "export_web",
  "forcing_material",
  "formats",
  "hexcrop",
  "hexnet",
  "hexnet_graphs",
  "hexnet_kernels",
  "hexo",
  "neural_search",
  "puct_search",
  "notation",
  "play",
  "process_tree",
  "proof",
  "tactical_proof",
  "time_control",
  "timed_engine",
  "timed_match",
  "timed_api",
  "six_engine",
]

[tool.setuptools.package-data]
tools = ["engines.json", "seal_adapter.cpp", "strix_learned/Cargo.toml", "strix_learned/Cargo.lock",
         "strix_learned/src/*.rs"]

[tool.setuptools.dynamic.optional-dependencies]
learning = {file = ["requirements/learning.txt"]}
api = {file = ["requirements/api.txt"]}
web = {file = ["requirements/web.txt"]}
